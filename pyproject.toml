[project]
name = "rag-service"
version = "0.1.0"
description = "Ingestion pipeline for PDF vectorization into LanceDB on S3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "lancedb[rerank]>=0.6.0",
    "pyarrow>=15.0.0",
    "pypdf[crypto]>=4.1.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=2.5.0",
    "fastembed>=0.8.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "tqdm>=4.70.0",
    "rouge-score>=0.1.2",
]

[tool.uv]
package = false
