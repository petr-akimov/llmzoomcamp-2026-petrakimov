apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-ui-deployment
  namespace: default
  labels:
    app: rag-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-ui
  template:
    metadata:
      labels:
        app: rag-ui
    spec:
      containers:
        - name: rag-ui
          # Replace with your Docker Hub repository and image tag
          image: petrakimovdocker/rag-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
              name: http
          env:
            # Internal Kubernetes DNS endpoint for the FastAPI backend
            - name: RAG_API_URL
              value: "http://rag-service.default.svc.cluster.local:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: "/_stcore/health"
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: "/_stcore/health"
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: rag-ui-service
  namespace: default
  labels:
    app: rag-ui
spec:
  type: ClusterIP
  ports:
    - port: 8501
      targetPort: 8501
      protocol: TCP
      name: http
  selector:
    app: rag-ui

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ui-ingress
  namespace: default
  annotations:
    # Proxy timeouts to allow smooth streaming responses
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: ui.akimovp.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-ui-service
                port:
                  number: 8501