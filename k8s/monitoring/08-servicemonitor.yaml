apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-service-monitor
  namespace: monitoring
  labels:
    release: kp
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: rag-service
  endpoints:
  - port: http
    path: /metrics
    interval: 10s
    metricRelabelings:
    - sourceLabels: [exported_endpoint]
      targetLabel: endpoint
    - regex: exported_endpoint
      action: labeldrop