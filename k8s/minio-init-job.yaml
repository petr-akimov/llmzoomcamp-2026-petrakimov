apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-minio
        image: alpine:3.23.3
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "📦 Installing MinIO Client and curl..."
            apk add --no-cache curl
            wget https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
            chmod +x /usr/local/bin/mc
            
            echo "🔧 Waiting for MinIO to be ready..."
            until mc alias set myminio http://minio.default.svc.cluster.local:9000 minio minio123; do
              echo "MinIO not ready yet, waiting..."
              sleep 5
            done
            
            echo "✅ MinIO is ready!"
            
            echo "📦 Creating buckets..."
            mc mb myminio/datasets --ignore-existing
            mc mb myminio/mlflow --ignore-existing
            mc mb myminio/pdf --ignore-existing
            
            echo "📥 Downloading reference data from GitHub..."
            curl -L -o /tmp/ancient_rome.pdf https://raw.githubusercontent.com/petr-akimov/myfiles/refs/heads/main/ancient_rome.pdf
            curl -L -o /tmp/us.pdf https://raw.githubusercontent.com/petr-akimov/myfiles/refs/heads/main/a_little_history_of_the_us_jw_davidson.pdf
            
            echo "📤 Uploading reference data to MinIO..."
            mc cp /tmp/us.pdf myminio/pdf/us.pdf
            mc cp /tmp/ancient_rome.pdf myminio/pdf/ancient_rome.pdf
            echo "✅ MinIO initialization completed!"
            mc ls myminio/datasets/
