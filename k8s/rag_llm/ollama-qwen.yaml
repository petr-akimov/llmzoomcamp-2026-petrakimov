apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-qwen
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-qwen
  template:
    metadata:
      labels:
        app: ollama-qwen
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"  
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 6Gi
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - "sleep 5 && ollama pull qwen2.5:1.5b && ollama pull qwen2.5:0.5b"
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-qwen-service
  namespace: default
spec:
  selector:
    app: ollama-qwen
  ports:
  - port: 11434
    targetPort: 11434